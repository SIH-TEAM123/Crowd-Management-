<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - VIZITOR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-visual">
            <div class="login-visual-text">

                <h2>
                    Create a new password.<br>
                    Get back in securely.
                </h2>

                <p>
                    Verify the reset code sent to your email and create a new
                    password for your VIZITOR account.
                </p>

            </div>
        </div>


        <!-- RIGHT SIDE -->
        <div class="login-form-side">

            <div class="login-form-wrapper">

                <!-- LOGO -->
                <div class="logo-container">

                    <svg
                        class="logo-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M12 2L2 7v10l10 5 10-5V7L12 2z"
                            fill="rgba(124, 58, 237, 0.15)"
                            stroke="#7c3aed"
                            stroke-width="2"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                            fill="#7c3aed"
                        />
                    </svg>

                    <span class="logo-text">VIZITOR</span>

                </div>


                <!-- HEADER -->
                <div class="form-header">

                    <h1>Reset password</h1>

                    <p>
                        Enter the OTP from your email and choose a new password.
                    </p>

                </div>


                <!-- FORM -->
                <form class="login-form" id="resetPasswordForm">

                    <!-- OTP -->
                    <div class="input-group">

                        <label for="otp">
                            Reset OTP
                        </label>

                        <input
                            type="text"
                            id="otp"
                            placeholder="Enter the reset code"
                            maxlength="6"
                            required
                            autocomplete="one-time-code"
                        >

                    </div>


                    <!-- NEW PASSWORD -->
                    <div class="input-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter your new password"
                            required
                            autocomplete="new-password"
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your new password"
                            required
                            autocomplete="new-password"
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Reset Password
                    </button>

                </form>


                <!-- BACK -->
                <div class="form-footer">

                    Remember your password?

                    <a href="index.html">
                        Sign in
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/reset-password.js"></script>

</body>

</html>
