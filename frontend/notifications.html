<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - VIZITOR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard-layout">

        <!-- ================= SIDEBAR ================= -->
        <aside class="sidebar">

            <div class="sidebar-brand">
                <svg class="logo-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2.5"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M12 2L2 7v10l10 5 10-5V7L12 2z"
                          fill="rgba(124,58,237,0.15)"
                          stroke="#7c3aed"
                          stroke-width="2"/>

                    <circle cx="12"
                            cy="12"
                            r="3"
                            fill="#7c3aed"/>
                </svg>

                <span class="logo-text">VIZITOR</span>
            </div>

            <nav class="sidebar-menu">

                <!-- Dashboard -->
                <a href="dashboard.html" class="menu-item">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>

                    </svg>

                    <span>Dashboard</span>

                </a>

                <!-- Appointments -->
                <a href="appointments.html" class="menu-item">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <rect x="3"
                              y="4"
                              width="18"
                              height="18"
                              rx="2"
                              ry="2"/>

                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>

                    </svg>

                    <span>Appointments</span>

                </a>

                <!-- Queue / Token -->
                <a href="queue.html" class="menu-item">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <rect x="2"
                              y="6"
                              width="20"
                              height="12"
                              rx="2"/>

                        <line x1="6" y1="12" x2="18" y2="12"/>
                        <line x1="6" y1="8" x2="6" y2="16"/>
                        <line x1="18" y1="8" x2="18" y2="16"/>

                    </svg>

                    <span>Queue / Token</span>

                </a>

                <!-- Crowd Status -->
                <a href="crowd.html" class="menu-item">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>

                    </svg>

                    <span>Crowd Status</span>

                </a>

                <!-- Crowd Forecast -->
                <a href="crowd-forecast.html" class="menu-item">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                        <polyline points="17 6 23 6 23 12"/>

                    </svg>

                    <span>Crowd Forecast</span>

                </a>

                <!-- Patient 360 -->
                <a href="healthcare.html" class="menu-item">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
                        <path d="M12 8v8"/>
                        <path d="M8 12h8"/>

                    </svg>

                    <span>Patient 360</span>

                </a>

                <!-- Profile -->
                <a href="profile.html" class="menu-item">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>

                    </svg>

                    <span>Profile</span>

                </a>

                <!-- Notifications - ACTIVE -->
                <a href="notifications.html" class="menu-item active">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>

                    </svg>

                    <span>Notifications</span>

                </a>

            </nav>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">

                <a href="index.html" class="menu-item">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21"
                              y1="12"
                              x2="9"
                              y2="12"/>

                    </svg>

                    <span>Logout</span>

                </a>

            </div>

        </aside>

        <!-- ================= MAIN CONTENT ================= -->
        <main class="main-content">

            <!-- Top Header -->
            <header class="top-header">

                <div class="header-left">

                    <div class="search-bar">

                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">

                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21"
                                  y1="21"
                                  x2="16.65"
                                  y2="16.65"/>

                        </svg>

                        <input type="text"
                               placeholder="Search services...">

                    </div>

                </div>

                <div class="header-right">

                    <!-- Help -->
                    <button class="icon-btn" title="Help">

                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">

                            <circle cx="12" cy="12" r="10"/>

                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>

                            <line x1="12"
                                  y1="17"
                                  x2="12.01"
                                  y2="17"/>

                        </svg>

                    </button>

                    <!-- Notification Button -->
                    <button class="icon-btn"
                            title="Notifications">

                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">

                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>

                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>

                        </svg>

                        <span class="notification-dot"
                              id="headerNotifDot">
                        </span>

                    </button>

                    <!-- Profile -->
                    <div class="profile-badge">

                        <div class="profile-avatar">
                            AM
                        </div>

                    </div>

                </div>

            </header>

            <!-- ================= NOTIFICATIONS BODY ================= -->
            <div class="dashboard-body notif-page">

                <!-- Welcome Row -->
                <div class="welcome-row">

                    <div class="welcome-text">

                        <h2>Notifications</h2>

                        <p id="notifSummary">
                            You have 4 unread notifications.
                        </p>

                    </div>

                    <div class="welcome-actions">

                        <button class="btn-report"
                                id="btnMarkAllRead"
                                type="button">

                            Mark All as Read

                        </button>

                    </div>

                </div>

                <!-- Notifications Panel -->
                <div class="card-panel">

                    <div class="panel-header">

                        <h3 class="panel-title">
                            All Updates
                        </h3>

                        <span class="section-count"
                              id="unreadCount">
                            4 unread
                        </span>

                    </div>

                    <!-- Category Filters -->
                    <div class="status-strip"
                         id="categoryFilters">

                        <button type="button"
                                class="status-pill active-status"
                                data-category="all">
                            All
                        </button>

                        <button type="button"
                                class="status-pill inactive-status"
                                data-category="appointment">
                            Appointment
                        </button>

                        <button type="button"
                                class="status-pill inactive-status"
                                data-category="queue">
                            Queue
                        </button>

                        <button type="button"
                                class="status-pill inactive-status"
                                data-category="crowd">
                            Crowd Status
                        </button>

                        <button type="button"
                                class="status-pill inactive-status"
                                data-category="system">
                            System
                        </button>

                    </div>

                    <!-- Notification List -->
                    <div class="notif-list"
                         id="notifList">
                    </div>

                    <!-- Empty State -->
                    <div class="empty-state"
                         id="notifEmpty"
                         hidden>

                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">

                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>

                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>

                        </svg>

                        <p id="emptyMessage">
                            You have no notifications right now.
                        </p>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/notifications.js"></script>

</body>
</html>
