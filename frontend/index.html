<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - VIZITOR</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/vizi.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
<div class="login-visual">
</div>


        <!-- RIGHT SIDE -->
        <div class="login-form-side">

            <div class="login-form-wrapper">


                <!-- BRANDING -->
                <div class="logo-container">

                    <svg
                        class="logo-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M12 2L2 7v10l10 5 10-5V7L12 2z"
                            fill="rgba(124, 58, 237, 0.15)"
                            stroke="#7c3aed"
                            stroke-width="2"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                            fill="#7c3aed"
                        />
                    </svg>

                    <span class="logo-text">
                        VIZITOR
                    </span>

                </div>


                <!-- HEADER -->
                <div class="form-header">

                    <h1>
                        Welcome back
                    </h1>

                    <p>
                        Please enter your details to sign in.
                    </p>

                </div>


                <!-- LOGIN FORM -->
                <form
                    class="login-form"
                    id="loginForm"
                >

                    <!-- EMAIL -->
                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                            autocomplete="email"
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >

                    </div>


                    <!-- REMEMBER + FORGOT PASSWORD -->
                    <div class="form-actions">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>
                                Remember for 30 days
                            </span>

                        </label>


                        <a
                            href="forgot-password.html"
                            class="forgot-password"
                        >
                            Forgot password?
                        </a>

                    </div>


                    <!-- SIGN IN BUTTON -->
                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Sign in
                    </button>


                    <!-- GOOGLE SIGN IN -->
                    <button
                        type="button"
                        class="btn-google"
                        id="btnGoogle"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                fill="#4285F4"
                            />

                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853"
                            />

                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                                fill="#FBBC05"
                            />

                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                                fill="#EA4335"
                            />
                        </svg>

                        Sign in with Google

                    </button>

                </form>


                <!-- SIGN UP -->
                <div class="form-footer">

                    Don't have an account?

                    <a href="signup.html">
                        Sign up
                    </a>

                </div>

                <!-- DEMO ACCOUNTS QUICK-FILL -->
                <div style="margin-top: 18px; padding: 12px 14px; background: rgba(124, 58, 237, 0.05); border: 1px dashed #7c3aed; border-radius: 10px; font-size: 0.82rem; color: #475569;">
                    <div style="font-weight: 600; color: #7c3aed; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
                        <span>⚡ Quick Test Logins (Password: Password123!)</span>
                    </div>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button type="button" onclick="document.getElementById('email').value='aryansahoo211@gmail.com'; document.getElementById('password').value='Password123!';" style="flex: 1; min-width: 140px; padding: 6px 10px; background: white; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 0.78rem; font-weight: 500; color: #1e293b;">
                            👤 Patient (Aryan)
                        </button>
                        <button type="button" onclick="document.getElementById('email').value='doctor_test_e2e@vizitor.gov.in'; document.getElementById('password').value='Password123!';" style="flex: 1; min-width: 140px; padding: 6px 10px; background: white; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 0.78rem; font-weight: 500; color: #1e293b;">
                            🩺 Doctor (Dr. Aryan)
                        </button>
                    </div>
                </div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <script src="js/i18n.js"></script>
    <script src="js/vizi.js"></script>
</body>

</html>
