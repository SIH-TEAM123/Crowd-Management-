<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - VIZITOR</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/vizi.css">
</head>

<body>

    <div class="login-container">

        <div class="login-visual">
            <div class="login-visual-text">
                <h2>Verify your account.</h2>
                <p>
                    Enter the verification code sent to your email
                    to activate your VIZITOR account.
                </p>
            </div>
        </div>

        <div class="login-form-side">

            <div class="login-form-wrapper">

                <div class="logo-container">

    <svg class="logo-icon"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">

        <path d="M12 2L2 7v10l10 5 10-5V7L12 2z"
              fill="rgba(124, 58, 237, 0.15)"
              stroke="#7c3aed"
              stroke-width="2"/>

        <circle cx="12"
                cy="12"
                r="3"
                fill="#7c3aed"/>
    </svg>

    <span class="logo-text">VIZITOR</span>

</div>

                <div class="form-header">
                    <h1>Verify your email</h1>
                    <p>Enter the 6-digit OTP sent to your email.</p>
                </div>

                <form class="login-form" id="verifyOtpForm">

    <div class="input-group">
        <label for="otp">Verification Code</label>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            required
        >
    </div>

    <button type="submit" class="btn-primary">
        Verify OTP
    </button>

    <button
        type="button"
        id="resendOtp"
        class="btn-primary"
        style="margin-top: 10px;"
    >
        Resend OTP
    </button>

</form>

                <div class="form-footer">
                    <a href="index.html">Back to Sign In</a>
                </div>

            </div>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/verify-otp.js"></script>

    <script src="js/vizi.js"></script>
</body>
</html>
