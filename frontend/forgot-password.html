<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - VIZITOR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-visual">
            <div class="login-visual-text">

                <h2>
                    Secure access,<br>
                    simplified.
                </h2>

                <p>
                    Reset your VIZITOR account password securely and get
                    back to managing visitors, appointments, queues, and crowd flow.
                </p>

            </div>
        </div>


        <!-- RIGHT SIDE -->
        <div class="login-form-side">

            <div class="login-form-wrapper">

                <!-- LOGO -->
                <div class="logo-container">

                    <svg class="logo-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M12 2L2 7v10l10 5 10-5V7L12 2z"
                              fill="rgba(124, 58, 237, 0.15)"
                              stroke="#7c3aed"
                              stroke-width="2"/>

                        <circle cx="12"
                                cy="12"
                                r="3"
                                fill="#7c3aed"/>
                    </svg>

                    <span class="logo-text">VIZITOR</span>

                </div>


                <!-- HEADER -->
                <div class="form-header">

                    <h1>Forgot password?</h1>

                    <p>
                        Enter your email and we'll send you a reset OTP.
                    </p>

                </div>


                <!-- FORM -->
                <form class="login-form" id="forgotPasswordForm">

                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your registered email"
                            required
                            autocomplete="email"
                        >

                    </div>


                    <button type="submit"
                            class="btn-primary">

                        Send Reset Code

                    </button>

                </form>


                <!-- BACK TO LOGIN -->
                <div class="form-footer">

                    Remember your password?

                    <a href="index.html">
                        Sign in
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/forgot-password.js"></script>

</body>

</html>
