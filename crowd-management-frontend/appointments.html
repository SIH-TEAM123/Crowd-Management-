<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Appointments - Symmetry</title>

    <!-- Import Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard-layout">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <svg
                class="logo-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path
                    d="M12 2L2 7v10l10 5 10-5V7L12 2z"
                    fill="rgba(124,58,237,0.15)"
                    stroke="#7c3aed"
                    stroke-width="2"
                />

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                    fill="#7c3aed"
                />
            </svg>

            <span class="logo-text">
                Symmetry
            </span>

        </div>


        <!-- Sidebar Navigation -->

        <nav class="sidebar-menu">

            <a
                href="dashboard.html"
                class="menu-item"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>

                <span>Dashboard</span>

            </a>


            <a
                href="appointments.html"
                class="menu-item active"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <rect
                        x="3"
                        y="4"
                        width="18"
                        height="18"
                        rx="2"
                        ry="2"
                    />

                    <line
                        x1="16"
                        y1="2"
                        x2="16"
                        y2="6"
                    />

                    <line
                        x1="8"
                        y1="2"
                        x2="8"
                        y2="6"
                    />

                    <line
                        x1="3"
                        y1="10"
                        x2="21"
                        y2="10"
                    />

                </svg>

                <span>Appointments</span>

            </a>


            <a
                href="queue.html"
                class="menu-item"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <rect
                        x="2"
                        y="6"
                        width="20"
                        height="12"
                        rx="2"
                    />

                    <line
                        x1="6"
                        y1="12"
                        x2="18"
                        y2="12"
                    />

                </svg>

                <span>Queue / Token</span>

            </a>


            <a
                href="crowd.html"
                class="menu-item"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>

                    <circle
                        cx="9"
                        cy="7"
                        r="4"
                    />

                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>

                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>

                </svg>

                <span>Crowd Status</span>

            </a>


            <a
                href="profile.html"
                class="menu-item"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>

                    <circle
                        cx="12"
                        cy="7"
                        r="4"
                    />

                </svg>

                <span>Profile</span>

            </a>


            <a
                href="notifications.html"
                class="menu-item"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>

                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>

                </svg>

                <span>Notifications</span>

            </a>

        </nav>


        <!-- Logout -->

        <div class="sidebar-footer">

            <a
                href="index.html"
                class="menu-item"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>

                    <polyline
                        points="16 17 21 12 16 7"
                    />

                    <line
                        x1="21"
                        y1="12"
                        x2="9"
                        y2="12"
                    />

                </svg>

                <span>Logout</span>

            </a>

        </div>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">


        <!-- Header -->

        <header class="top-header">

            <div class="header-left">

                <div class="search-bar">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <circle
                            cx="11"
                            cy="11"
                            r="8"
                        />

                        <line
                            x1="21"
                            y1="21"
                            x2="16.65"
                            y2="16.65"
                        />

                    </svg>

                    <input
                        type="text"
                        placeholder="Search services..."
                    >

                </div>

            </div>


            <div class="header-right">


                <!-- Help -->

                <button
                    class="icon-btn"
                    title="Help"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="10"
                        />

                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>

                        <line
                            x1="12"
                            y1="17"
                            x2="12.01"
                            y2="17"
                        />

                    </svg>

                </button>


                <!-- Notifications -->

                <button
                    class="icon-btn"
                    title="Notifications"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>

                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>

                    </svg>

                    <span class="notification-dot"></span>

                </button>


                <!-- Profile -->

                <div class="profile-badge">

                    <div class="profile-avatar">
                        AM
                    </div>

                </div>

            </div>

        </header>


        <!-- ================= PAGE BODY ================= -->

        <div class="dashboard-body">


            <!-- Page Title -->

            <div class="welcome-row">

                <div class="welcome-text">

                    <h2>
                        My Appointments
                    </h2>

                    <p>
                        View, manage, and book your upcoming service appointments.
                    </p>

                </div>


                <div class="welcome-actions">

                    <button
                        class="btn-create"
                        id="btnBookNew"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            style="width:16px;height:16px;"
                        >

                            <line
                                x1="12"
                                y1="5"
                                x2="12"
                                y2="19"
                            />

                            <line
                                x1="5"
                                y1="12"
                                x2="19"
                                y2="12"
                            />

                        </svg>

                        Book New Appointment

                    </button>

                </div>

            </div>


            <!-- ================= UPCOMING APPOINTMENTS ================= -->

            <div class="card-panel">

                <div class="section-header">

                    <div
                        style="
                            display:flex;
                            align-items:center;
                        "
                    >

                        <span class="section-title">
                            Upcoming Appointments
                        </span>


                        <!-- Starts at 0.
                             appointments.js updates this -->

                        <span
                            class="section-count"
                            id="upcomingCount"
                        >
                            0
                        </span>

                    </div>

                </div>


                <!-- REAL APPOINTMENTS WILL BE INSERTED HERE -->

                <div
                    class="appointments-grid"
                    id="upcomingGrid"
                >

                </div>

            </div>


            <!-- ================= PREVIOUS APPOINTMENTS ================= -->

            <div class="card-panel">

                <div class="section-header">

                    <div
                        style="
                            display:flex;
                            align-items:center;
                        "
                    >

                        <span class="section-title">
                            Previous Appointments
                        </span>


                        <!-- appointments.js can update this -->

                        <span
                            class="section-count"
                            id="prevCount"
                        >
                            0
                        </span>

                    </div>

                </div>


                <div class="prev-table-container">

                    <table
                        class="dashboard-table"
                        id="prevTable"
                    >

                        <thead>

                            <tr>

                                <th>
                                    Service
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Token
                                </th>

                                <th>
                                    Status
                                </th>

                            </tr>

                        </thead>


                        <!-- REAL PREVIOUS APPOINTMENTS
                             WILL BE INSERTED HERE -->

                        <tbody id="prevTableBody">

                        </tbody>

                    </table>

                </div>

            </div>


        </div>

    </main>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script src="js/api.js"></script>

<script src="js/appointments.js"></script>


</body>
</html>
