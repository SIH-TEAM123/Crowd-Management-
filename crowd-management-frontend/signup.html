<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Symmetry</title>
    <!-- Import modern Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        
        <!-- Left Side - Aesthetic Visual Section -->
        <div class="login-visual">
            <div class="login-visual-text">
                <h2>Intelligence first.</h2>
                <p>The ultimate artificial intelligence platform designed to unlock your potential and accelerate your workflow.</p>
            </div>
        </div>
        
        <!-- Right Side - Interactive Signup Form Section -->
        <div class="login-form-side">
            <div class="login-form-wrapper">
                
                <!-- Branding Logo -->
                <div class="logo-container">
                    <!-- Clean SVG Hexagon Logo -->
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7v10l10 5 10-5V7L12 2z" fill="rgba(124, 58, 237, 0.15)" stroke="#7c3aed" stroke-width="2"/>
                        <circle cx="12" cy="12" r="3" fill="#7c3aed"/>
                    </svg>
                    <span class="logo-text">Symmetry</span>
                </div>
                
                <!-- Welcome Headers -->
                <div class="form-header">
                    <h1>Create an account</h1>
                    <p>Please enter your details to sign up.</p>
                </div>

                <!-- Global Feedback Banners -->
                <div class="demo-mode-badge" id="demoBadge" style="display: none;">
                    <span>⚠️ Frontend Demo Mode Active (Local Testing)</span>
                </div>
                <div class="form-error-banner" id="formErrorBanner" style="display: none;"></div>
                <div class="form-success-banner" id="formSuccessBanner" style="display: none;"></div>
                
                <!-- Signup Form -->
                <form class="login-form" id="signupForm" novalidate>
                    
                    <!-- Full Name Field -->
                    <div class="input-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="Enter your full name" autocomplete="name">
                        <span class="field-error" id="fullNameError"></span>
                    </div>

                    <!-- Email Field -->
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
                        <span class="field-error" id="emailError"></span>
                    </div>

                    <!-- Phone Number Field -->
                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter your phone number" autocomplete="tel">
                        <span class="field-error" id="phoneError"></span>
                    </div>
                    
                    <!-- Password Field -->
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">
                        <span class="field-error" id="passwordError"></span>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="input-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
                        <span class="field-error" id="confirmPasswordError"></span>
                    </div>
                    
                    <!-- Buttons -->
                    <button type="submit" class="btn-primary" id="btnSubmit">Create Account</button>
                    
                    <button type="button" class="btn-google" id="btnGoogleSignup">
                        <!-- Brand Google Logo Vector -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                        </svg>
                        Sign up with Google
                    </button>
                    
                </form>
                
                <!-- Bottom Sign In Link -->
                <div class="form-footer">
                    Already have an account? <a href="index.html">Sign In</a>
                </div>
                
            </div>
        </div>
        
    </div>

    <!-- Script imports -->
    <script src="js/api.js"></script>
    <script src="js/signup.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('ServiceWorker registered:', reg.scope))
                    .catch(err => console.warn('ServiceWorker registration failed:', err));
            });
        }
    </script>
</body>
</html>
