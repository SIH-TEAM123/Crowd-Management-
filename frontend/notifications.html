<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - VIZITOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-brand">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7v10l10 5 10-5V7L12 2z" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="2"/>
                    <circle cx="12" cy="12" r="3" fill="#7c3aed"/>
                </svg>
                <span class="logo-text">VIZITOR</span>
            </div>

            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="appointments.html" class="menu-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span>Appointments</span>
                </a>
                <a href="queue.html" class="menu-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="6" width="20" height="12" rx="2"/>
                        <line x1="6" y1="12" x2="18" y2="12"/>
                        <line x1="6" y1="8" x2="6" y2="16"/>
                        <line x1="18" y1="8" x2="18" y2="16"/>
                    </svg>
                    <span>Queue / Token</span>
                </a>
                <a href="crowd.html" class="menu-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span>Crowd Status</span>
                </a>
                <a href="profile.html" class="menu-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>Profile</span>
                </a>
<a href="arcade.html" class="menu-item">
    <svg viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="3"/>
        <line x1="8" y1="12" x2="11" y2="12"/>
        <line x1="9.5" y1="10.5" x2="9.5" y2="13.5"/>
        <circle cx="16" cy="10" r="1"/>
        <circle cx="18" cy="13" r="1"/>
    </svg>
    <span>Arcade</span>
</a>
                <a href="notifications.html" class="menu-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span>Notifications</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="index.html" class="menu-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <main class="main-content">

            <header class="top-header">
                <div class="header-left">
                    <div class="search-bar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" placeholder="Search services...">
                    </div>
                </div>
                <div class="header-right">
                    <button class="icon-btn" title="Help">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                    </button>
                    <button class="icon-btn" title="Notifications">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <span class="notification-dot" id="headerNotifDot"></span>
                    </button>
                    <div class="profile-badge">
                        <div class="profile-avatar">AM</div>
                    </div>
                </div>
            </header>

            <div class="dashboard-body notif-page">

                <div class="welcome-row">
                    <div class="welcome-text">
                        <h2>Notifications</h2>
                        <p id="notifSummary">You have 4 unread notifications.</p>
                    </div>
                    <div class="welcome-actions">
                        <button class="btn-report" id="btnMarkAllRead" type="button">
                            Mark All as Read
                        </button>
                    </div>
                </div>

                <div class="card-panel">
                    <div class="panel-header">
                        <h3 class="panel-title">All Updates</h3>
                        <span class="section-count" id="unreadCount">4 unread</span>
                    </div>

                    <div class="status-strip" id="categoryFilters">
                        <button type="button" class="status-pill active-status" data-category="all">All</button>
                        <button type="button" class="status-pill inactive-status" data-category="appointment">Appointment</button>
                        <button type="button" class="status-pill inactive-status" data-category="queue">Queue</button>
                        <button type="button" class="status-pill inactive-status" data-category="crowd">Crowd Status</button>
                        <button type="button" class="status-pill inactive-status" data-category="system">System</button>
                    </div>

                    <div class="notif-list" id="notifList"></div>

                    <div class="empty-state" id="notifEmpty" hidden>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <p id="emptyMessage">You have no notifications right now.</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
<script src="js/shared.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
